name: Qoder Daily

on:
  # 北京时间 每天 10:41（活动 10:00 开窗）；cron 用 UTC，北京时间 = UTC+8。
  # 取 10:41 而非 10:05 的原因：本账号定时实测有 2~6 小时延迟，且国际版活动
  # 约 10:29 才下发；脚本的重试窗口只在 10:00~10:29 生效，起跑太早反而会
  # 卡在窗口边缘签不到。挪到 10:41 后，无论准点还是迟到都在下发完成之后。
  # 想停用定时：把下面 schedule 两行注释掉即可。
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Qoder-Daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      QODER_CACHE_KEY: ${{ secrets.QODER_CACHE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Warn missing cache encryption key
        if: ${{ env.QODER_CACHE_KEY == '' }}
        run: |
          echo "::warning::未设置 QODER_CACHE_KEY，本次将跳过 token 状态持久化；轮换后的 refresh_token 可能无法在下次运行恢复。"

      - name: Restore encrypted token state
        if: ${{ env.QODER_CACHE_KEY != '' }}
        uses: actions/cache/restore@v4
        with:
          path: .qoder-cache/state.enc
          key: qoder-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: qoder-state-v2-

      - name: Decrypt token state
        if: ${{ env.QODER_CACHE_KEY != '' && hashFiles('.qoder-cache/state.enc') != '' }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass env:QODER_CACHE_KEY -in .qoder-cache/state.enc -out "$RUNNER_TEMP/qoder-state.tar"
          tar -xf "$RUNNER_TEMP/qoder-state.tar" -C .
          rm -f "$RUNNER_TEMP/qoder-state.tar"

      - name: Run Qoder Daily
        env:
          QODER_TOKENS: ${{ secrets.QODER_TOKENS }}
          QODER_GLOBAL_TOKENS: ${{ secrets.QODER_GLOBAL_TOKENS }}
          QODER_MACHINE_TOKEN: ${{ secrets.QODER_MACHINE_TOKEN }}
          QODER_MACHINE_CODE: ${{ secrets.QODER_MACHINE_CODE }}
          QODER_MACHINE_TYPE: ${{ secrets.QODER_MACHINE_TYPE }}
          QODERCN_RUNTIME_INFO: ${{ secrets.QODERCN_RUNTIME_INFO }}
          QODER_RUNTIME_INFO: ${{ secrets.QODER_RUNTIME_INFO }}
          QODER_UMID_PATH: ${{ secrets.QODER_UMID_PATH }}
          QODER_UMID_NO_INSTALL: ${{ secrets.QODER_UMID_NO_INSTALL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          QODER_WINDOW_RETRY: "1"
          QODER_WINDOW_RETRY_MAX: "16"
          QODER_WINDOW_RETRY_GAP: "90"
        run: |
          # 保留原有失败语义：脚本非零退出仍然让作业变红，
          # 同时把完整输出留一份到临时文件，供后面的结果汇总步骤读取。
          set +e
          python qoder_daily.py 2>&1 | tee "$RUNNER_TEMP/daily.log"
          code="${PIPESTATUS[0]}"
          set -e
          echo "daily_exit_code=$code" >> "$GITHUB_ENV"
          exit "$code"

      # Refresh may succeed before a later request fails; retain rotated tokens.
      - name: Encrypt token state
        if: ${{ always() && env.QODER_CACHE_KEY != '' }}
        run: |
          mkdir -p .qoder-cache
          files=""
          for f in qoder_tokens.json qoder_machine_id; do
            if [ -f "$f" ]; then files="$files $f"; fi
          done
          if [ -n "$files" ]; then
            tar -cf "$RUNNER_TEMP/qoder-state.tar" $files
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:QODER_CACHE_KEY -in "$RUNNER_TEMP/qoder-state.tar" -out .qoder-cache/state.enc
            rm -f "$RUNNER_TEMP/qoder-state.tar"
          fi

      - name: Save encrypted token state
        if: ${{ always() && env.QODER_CACHE_KEY != '' && hashFiles('.qoder-cache/state.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .qoder-cache/state.enc
          key: qoder-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      # 无论成功失败都把运行结果打印出来：一份进日志（纯文本），
      # 一份进运行页面的 Summary 标签（Markdown 表格 + 输出代码块）。
      - name: Print run result
        if: always()
        run: |
          log="$RUNNER_TEMP/daily.log"
          if [ -f "$log" ]; then
            report="$(grep -E '\[[0-9]{2}:[0-9]{2}:[0-9]{2}\]' "$log" | tail -n 60 || true)"
            if [ -z "$report" ]; then report="$(tail -n 40 "$log" || true)"; fi
          else
            report="（脚本未执行或没有产生输出）"
          fi
          # 兜底脱敏：任何令牌片段都不写进结果汇总
          report="$(printf '%s\n' "$report" | sed -E 's/(dt|drt)-[A-Za-z0-9_-]{4,}/\1-****/g')"

          case "${{ job.status }}" in
            success) verdict="✅ 成功" ;;
            failure) verdict="❌ 失败" ;;
            cancelled) verdict="⛔ 已取消" ;;
            *) verdict="${{ job.status }}" ;;
          esac

          persist="未启用"
          if [ -n "$QODER_CACHE_KEY" ]; then persist="已启用"; fi
          now="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          code="${daily_exit_code:-未知}"

          echo ""
          echo "=================== Qoder Daily 运行结果 ==================="
          echo "结论        : $verdict"
          echo "北京时间    : $now"
          echo "触发方式    : ${{ github.event_name }}"
          echo "运行编号    : #${{ github.run_number }} (attempt ${{ github.run_attempt }})"
          echo "脚本退出码  : $code"
          echo "状态持久化  : $persist"
          echo "------------------------- 脚本输出 -------------------------"
          printf '%s\n' "$report"
          echo "============================================================"

          {
            echo "## Qoder Daily 运行结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 结论 | $verdict |"
            echo "| 北京时间 | $now |"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 运行编号 | #${{ github.run_number }}（attempt ${{ github.run_attempt }}） |"
            echo "| 脚本退出码 | \`$code\` |"
            echo "| Token 状态持久化 | $persist |"
            echo ""
            echo "### 脚本输出"
            echo ""
            echo '```text'
            printf '%s\n' "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

